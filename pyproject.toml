[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsm-transformer-lab"
version = "0.1.0"
description = "Learning-focused QSM reconstruction project with U-Net, ResNet, and Transformer variants"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "tqdm>=4.66"
]

[tool.setuptools.packages.find]
where = ["src"]
